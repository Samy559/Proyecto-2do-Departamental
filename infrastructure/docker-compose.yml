services:
  # Base de datos PostgreSQL para el backend de IINICIA
  postgres-db:
    image: postgres:15
    container_name: iinicia_postgres
    restart: always
    environment:
      POSTGRES_USER: iinicia_user
      POSTGRES_PASSWORD: iinicia_password
      POSTGRES_DB: iinicia_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Base de datos MariaDB para Moodle
  mariadb-moodle:
    image: mariadb:10.11
    container_name: iinicia_mariadb
    restart: always
    command: [
      "--character-set-server=utf8mb4",
      "--collation-server=utf8mb4_unicode_ci",
      "--default-storage-engine=innodb",
      "--innodb-file-per-table=1"
    ]
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: moodle
      MYSQL_USER: moodle
      MYSQL_PASSWORD: moodlepassword
    volumes:
      - mariadb_data:/var/lib/mysql

  # LMS Moodle preempaquetado listo
  moodle:
    image: moodlehq/moodle-php-apache:8.2
    container_name: iinicia_moodle
    restart: always
    ports:
      - "8080:80"
    environment:
      MOODLE_URL: "http://localhost:8080"
      MOODLE_DOCKER_DBTYPE: "mariadb"
      MOODLE_DOCKER_DBHOST: "mariadb-moodle"
      MOODLE_DOCKER_DBNAME: "moodle"
      MOODLE_DOCKER_DBUSER: "moodle"
      MOODLE_DOCKER_DBPASS: "moodlepassword"
    volumes:
      - moodle_data:/var/www/html
      - moodledata_data:/var/www/moodledata
    depends_on:
      - mariadb-moodle

volumes:
  pgdata:
  mariadb_data:
  moodle_data:
  moodledata_data: